{% extends "base.html" %}
{% block content %}
<div class="auth-wrapper d-flex justify-content-center align-items-center">
  <div class="auth-card card shadow-lg p-4">
    <h2 class="auth-title mb-3 text-center">Create Account</h2>
    <form method="post">
      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input id="username" name="username" type="text" class="form-control" autocomplete="username" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input id="password" name="password" type="password" class="form-control" autocomplete="new-password" required>
      </div>
      <button type="submit" class="btn btn-success w-100">Register</button>
      <div class="text-center mt-3">
        <a class="btn btn-link p-0" href="{{ url_for('auth.login') }}">Already registered? Login here</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
