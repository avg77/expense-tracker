{% extends "base.html" %}
{% block content %}
<div class="auth-wrapper d-flex justify-content-center align-items-center">
  <div class="auth-card card shadow-lg p-4">
    <h2 class="auth-title mb-3 text-center">Account Login</h2>
    <form method="post">
      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input id="username" name="username" type="text" class="form-control" autocomplete="username" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required>
      </div>
      <div class="d-flex justify-content-between align-items-center mb-3 small text-muted">
        <div>
          <input type="checkbox" id="remember">
          <label for="remember" class="ms-1">Remember Me</label>
        </div>
        <a href="#" class="link-offset-1">Forgot Password?</a>
      </div>
      <button type="submit" class="btn btn-primary w-100">Log In</button>
      <div class="text-center mt-3">
        <a class="btn btn-link p-0" href="{{ url_for('auth.register') }}">No account? Register here</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
